<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#B0352B">
  <title>Album · La Repisa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,300,600">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.css">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <nav><div class="container"><a href="/">La Repisa</a></div></nav>
  <main class="container">
<p class="breadcrumb"><a href="/">Photos</a> / <span id="year"></span></p>
<h1 id="name" class="album-name"></h1>
<p id="meta" class="album-meta"></p>
<hr class="bleed-line">
<div id="gallery" class="gallery"></div>
<script src="/assets/signin.js"></script>
<script>
  // Originals and thumbs are served from the Google Cloud bucket `media.randomcurve.com`; its custom domain is HTTP only, which an HTTPS page cannot load (keep in sync with index.html)
  const PHOTOS = "https://storage.googleapis.com/media.randomcurve.com/photos/";
  const DAY = { month: "short", day: "numeric", year: "numeric" };
  const MONTH = { month: "long", year: "numeric" };

  // Album id comes from the query string, e.g. album.html?1999/1999-07-Graduation, or album.html?1999/Favorites for the year's ❤️ photos
  async function showAlbum(id) {
    const meta = document.getElementById("meta");
    const favorites = /^\d{4}\/Favorites$/.test(id);
    if (!favorites && !/^\d{4}\/\d{4}-\d{2}-[^/.]+$/.test(id)) return meta.textContent = "Album not found.";
    const [res, overrides] = await Promise.all([favorites || fetch(`${PHOTOS}albums/${id}.json`), loadOverrides(PHOTOS)]);
    const { excluded, covers } = overrides;
    const album = favorites ? { name: "Favorites", photos: yearFavorites(overrides, id.slice(0, 4)) } : res.ok ? await res.json() : undefined;
    if (!album) return meta.textContent = "Album not found.";
    // Photos voted 👎 are left out as the page loads, without rebuilding the album
    const photos = album.photos.filter((p) => !excluded.has(p.filename.normalize("NFC")));
    const cover = (covers[id.normalize("NFC")]?.cover ?? album.cover)?.normalize("NFC");

    document.title = `${album.name} · La Repisa`;
    document.getElementById("year").textContent = id.slice(0, 4);
    document.getElementById("name").textContent = album.name;
    meta.textContent = `${photos.length} photos · ${period(photos, id)}`;

    document.getElementById("gallery").replaceChildren(...photos.map((p, i) => {
      const a = Object.assign(document.createElement("a"), { href: PHOTOS + encodeURI(p.filename), onclick: view });
      const img = Object.assign(document.createElement("img"), { src: PHOTOS + encodeURI(p.thumb ?? p.filename), alt: `${album.name}, photo ${i + 1}`, loading: "lazy" });
      // Known size reserves the space, so the columns do not jump while loading
      if (p.width && p.height) Object.assign(img, { width: p.width, height: p.height });
      a.append(img, Object.assign(document.createElement("span"), { textContent: p.filename.split("/").pop() }), votes(p, id, { cover: p.filename.normalize("NFC") === cover, favorite: p.filename.normalize("NFC") in overrides.favorites }));
      return a;
    }));
  }

  // Thumbs up/down, ❤️ (the year's Favorites album) and 🖼️ (make it the album cover) shown on hover, the last two for
  // editors only; each click goes to functions/signin with who clicked (see sendSigned() in signin.js). The ❤️ of a
  // favorite and the current cover's 🖼️ stay marked
  function votes(photo, id, marked) {
    const box = Object.assign(document.createElement("div"), { className: "votes" });
    for (const [vote, label] of [["up", "👍"], ["down", "👎"]]) box.append(button(label, `Thumbs ${vote}`, "vote", () => sendSigned({ photo: photo.filename, vote }), () => box.querySelectorAll(".vote")));
    // A second click takes the ❤️ back, so the button toggles instead of staying marked
    const heart = button("❤️", "Favorite", "favorite", () => sendSigned({ ...photo, photo: photo.filename, favorite: !heart.classList.contains("voted") }), () => []);
    heart.addEventListener("sent", () => heart.classList.toggle("voted"));
    heart.classList.toggle("voted", marked.favorite);
    box.append(heart);
    // The Favorites album has no cover of its own
    if (id.endsWith("/Favorites")) return box;
    const cover = button("🖼️", "Make it the album cover", "cover", () => sendSigned({ album: id, cover: photo.filename, thumb: photo.thumb }), () => document.querySelectorAll(".votes .cover"));
    cover.classList.toggle("voted", marked.cover);
    box.append(cover);
    return box;
  }

  // Inside the photo's link: a click sends instead of zooming. Once recorded, the button stays marked (with a popping tick)
  // and the others from `group()` are unmarked, until the page is left; a failed one flashes red
  function button(label, title, className, send, group) {
    const button = Object.assign(document.createElement("button"), { type: "button", textContent: label, title, className });
    button.onclick = async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      button.classList.add("pending");
      const sent = await send();
      button.classList.remove("pending");
      if (!sent) {
        button.classList.add("failed");
        return setTimeout(() => button.classList.remove("failed"), 1500);
      }
      for (const b of group()) b.classList.toggle("voted", b === button);
      button.dispatchEvent(new Event("sent"));
      // Restart the pop when clicking the same button again
      button.classList.remove("pop");
      void button.offsetWidth;
      button.classList.add("pop");
    };
    return button;
  }

  // Zoom into the original (not the thumb) with the site-wide zoomPhoto() from site.js, which steps through the album's photos
  function view(ev) {
    ev.preventDefault();
    const links = [...document.querySelectorAll(".gallery a")];
    zoomPhoto(this.firstChild, links.map((a) => ({ src: a.href, alt: a.firstChild.alt })), links.indexOf(this));
  }

  // "Oct 10, 2026 – Oct 12, 2026" from photo dates, else the month from the album id
  function period(photos, id) {
    const dates = photos.map((p) => p.date).filter(Boolean).sort();
    if (!dates.length) return id.endsWith("/Favorites") ? id.slice(0, 4) : new Date(`${id.slice(5, 12)}-15`).toLocaleDateString("en-US", MONTH);
    const [first, last] = [dates[0], dates.at(-1)].map((d) => new Date(d).toLocaleDateString("en-US", DAY));
    return first === last ? first : `${first} – ${last}`;
  }

  signInThen(document.getElementById("meta"), () => showAlbum(decodeURIComponent(location.search.slice(1))));
</script>
  </main>
  <script src="/assets/site.js"></script>
</body>
</html>
